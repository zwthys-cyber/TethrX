name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  bridge:
    name: bridge (syntax + smoke)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: syntax
        run: |
          for f in bridge/src/*.mjs; do node --check "$f"; done
      - name: ESign configuration regression checks
        run: python3 -m unittest discover -s ios/tools -p 'test_*.py' -v
      - name: version format
        run: |
          # The app's "your bridge is out of date" banner parses this, and anything
          # that is not three plain integers makes it fail OPEN: no banner, ever,
          # on a shipped build that cannot be patched.
          V=$(node -p "require('./bridge/package.json').version")
          echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "bridge version '$V' must be exactly three integers"; exit 1; }
      - name: unit
        run: node bridge/test/verify-fixes.mjs
      - name: internet tunnel (unit)
        run: node bridge/test/verify-tunnel.mjs
      - name: push routing and key-less push payloads
        run: node bridge/test/verify-push.mjs --live
      - name: bridge meets app version requirement
        run: node bridge/test/verify-distribution.mjs
      - name: smoke
        run: |
          export HOME="$RUNNER_TEMP/home"
          mkdir -p "$HOME"
          GROK_REMOTE_HOST=127.0.0.1 GROK_REMOTE_PORT=4180 node bridge/src/server.mjs &
          sleep 2
          TOKEN=$(node -e "console.log(JSON.parse(require('fs').readFileSync(process.env.HOME+'/.grok-remote/config.json')).token)")

          # health, and it must advertise its version
          curl -fsS localhost:4180/api/health | grep -q '"ok":true'
          curl -fsS localhost:4180/api/health | grep -q '"version"'

          # auth: 401 without the token, 200 with it
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:4180/api/sessions)" = "401"
          curl -fsS -H "Authorization: Bearer $TOKEN" localhost:4180/api/sessions | grep -q '"sessions"'

          # pinned-HTTPS listener serves the same API, and its live cert matches
          # the fingerprint advertised over HTTP
          curl -fsSk https://localhost:4181/api/health | grep -q '"ok":true'
          ADV=$(curl -fsS localhost:4180/api/health | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).tls.fingerprint))")
          SERVED=$(echo | openssl s_client -connect 127.0.0.1:4181 2>/dev/null | openssl x509 -outform DER | openssl dgst -sha256 | awk '{print $NF}')
          test "$ADV" = "$SERVED"

          # fs browsing is home-jailed
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $TOKEN" 'localhost:4180/api/fs/dirs?path=/etc')" = "403"

          # the pairing page never leaves loopback semantics (no Origin, local Host)
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Origin: https://evil.example' localhost:4180/pair)" = "403"

          # the /pair inline script must PARSE — a bad escape once shipped a page
          # with no token and no QR codes in every browser
          curl -fsS -H 'Sec-Fetch-Site: none' localhost:4180/pair -o /tmp/pair.html
          node -e "const h=require('fs').readFileSync('/tmp/pair.html','utf8');const m=h.match(/<script>([\s\S]*?)<\/script>\s*<\/body>/);if(!m)throw new Error('no inline script');new Function(m[1]);console.log('pair page script parses')"

          # logs must never carry the pairing token — they get pasted into bug reports
          curl -fsS -H "Authorization: Bearer $TOKEN" localhost:4180/api/logs -o /tmp/logs.json
          # Via the environment: a token starting with "-" was parsed as a node option.
          TOKEN="$TOKEN" node -e "const t=process.env.TOKEN;if(!t)throw new Error('no token');const s=require('fs').readFileSync('/tmp/logs.json','utf8');if(s.includes(t))throw new Error('pairing token leaked into /api/logs');console.log('logs redacted')"

          # daily usage rollups
          curl -fsS -H "Authorization: Bearer $TOKEN" 'localhost:4180/api/usage/history?days=3' | grep -q '"days"'

          # the follow-up queue: survives on the bridge, and is listable + clearable.
          # (No grok binary on CI, so the turn itself can't run — the queue mechanics can.)
          SID=$(curl -fsS -X POST -H "Authorization: Bearer $TOKEN" -H 'content-type: application/json' \
                  -d '{"cwd":"/tmp","title":"ci"}' localhost:4180/api/sessions \
                | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).id))")
          curl -fsS -X POST -H "Authorization: Bearer $TOKEN" -H 'content-type: application/json' \
            -d '{"text":"queued from ci"}' "localhost:4180/api/sessions/$SID/queue" | grep -q '"ok":true'
          curl -fsS -X DELETE -H "Authorization: Bearer $TOKEN" "localhost:4180/api/sessions/$SID/queue" | grep -q '"ok":true'

          # Branching an empty session must NOT need grok, and must get its own name.
          # Deliberately a FRESH session: queueing into an idle one starts a turn, and
          # branching refuses (409) while a turn is running.
          BID=$(curl -fsS -X POST -H "Authorization: Bearer $TOKEN" -H 'content-type: application/json' \
                  -d '{"cwd":"/tmp","title":"fork"}' localhost:4180/api/sessions \
                | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).id))")
          curl -fsS -X POST -H "Authorization: Bearer $TOKEN" -H 'content-type: application/json' \
            -d '{}' "localhost:4180/api/sessions/$BID/branch" | grep -q '"title":"fork (2)"'

          # A plan approval must be an EXPLICIT boolean. This used to default to
          # approved on a missing or malformed body, so a POST that died in flight read
          # as "yes, implement the plan I just rejected".
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer $TOKEN" \
            -H 'content-type: application/json' -d '{}' \
            "localhost:4180/api/sessions/$SID/plan/anything")" = "400"

          # The one-time approval link is a mutation, so it must refuse a bare GET
          # (a link preview or a prefetch could otherwise burn the token).
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:4180/api/approve/whatever)" = "405"

          # a re-signed build registers its own bundle id and APNs environment
          curl -fsS -X POST -H "Authorization: Bearer $TOKEN" -H 'content-type: application/json' \
            -d "{\"token\":\"$(printf 'ab%.0s' {1..32})\",\"topic\":\"nsk-164.v-team.cn\",\"env\":\"development\"}" \
            localhost:4180/api/devices | grep -q '"ok":true'
          node -e "const d=JSON.parse(require('fs').readFileSync(process.env.HOME+'/.grok-remote/devices.json'));const i=d.info['ab'.repeat(32)];if(i.topic!=='nsk-164.v-team.cn'||i.env!=='development')throw new Error('device route not stored')"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer $TOKEN" -H 'content-type: application/json' \
            -d "{\"token\":\"$(printf 'ab%.0s' {1..32})\",\"env\":\"staging\"}" localhost:4180/api/devices)" = "400"

          # `service` must never fall through into starting a server
          node bridge/src/server.mjs service status | grep -q 'TethrX bridge service'

      - name: Package and install the distributed bridge
        run: |
          set -euo pipefail
          DIST="$RUNNER_TEMP/bridge-dist"
          INSTALL="$RUNNER_TEMP/bridge-install"
          mkdir -p "$DIST"
          VERSION="$(node -p "require('./bridge/package.json').version")"
          npm pack ./bridge --ignore-scripts --pack-destination "$DIST"
          mv "$DIST/tethrx-bridge-$VERSION.tgz" "$DIST/tethrx-bridge.tgz"
          npm install --global --ignore-scripts --no-audit --no-fund --prefix "$INSTALL" "$DIST/tethrx-bridge.tgz"
          TETHRX_MANIFEST_PATH="$DIST/bridge-version.json" node bridge/test/verify-distribution.mjs "$INSTALL/lib/node_modules/tethrx-bridge"
          (cd "$DIST" && sha256sum tethrx-bridge.tgz > tethrx-bridge.tgz.sha256)
          # Run the INSTALLED package, so missing files or a bad bin entry cannot
          # pass just because the source checkout starts correctly.
          GROK_REMOTE_HOST=127.0.0.1 GROK_REMOTE_PORT=4190 GROK_REMOTE_TLS_PORT=4191 \
            GROK_REMOTE_GROK_AUTO_UPDATE=0 "$INSTALL/bin/tethrx-bridge" > "$RUNNER_TEMP/bridge-package.log" 2>&1 &
          PACKAGE_PID=$!
          trap 'kill "$PACKAGE_PID" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4190/api/health -o "$RUNNER_TEMP/bridge-package-health.json"; then break; fi
            sleep 1
          done
          node -e 'const fs=require("fs");const h=JSON.parse(fs.readFileSync(process.argv[1]));if(!h.ok||h.version!==process.argv[2])throw Error("Installed bridge does not serve the expected version")' "$RUNNER_TEMP/bridge-package-health.json" "$VERSION"

      - uses: actions/upload-artifact@v6
        with:
          name: tethrx-bridge-package
          path: ${{ runner.temp }}/bridge-dist/*
          if-no-files-found: error

  tunnel:
    name: bridge over the internet (Cloudflare tunnel, no VPN)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Install the packaged bridge
        run: |
          set -euo pipefail
          npm pack ./bridge --ignore-scripts --pack-destination "$RUNNER_TEMP"
          npm install --global --ignore-scripts --no-audit --no-fund --prefix "$RUNNER_TEMP/bridge-install" "$RUNNER_TEMP"/tethrx-bridge-*.tgz
      - name: Phone's view through a public tunnel
        run: |
          # Starts the INSTALLED bridge with --tunnel (which downloads cloudflared
          # itself), then, over the public https address only: auth, the pairing
          # page staying private, a live POST event stream, and the signed address
          # announcement the app follows. Cloudflare and ntfy.sh are external
          # services, so a failed attempt gets retried before failing the build.
          for attempt in 1 2 3; do
            if node bridge/test/verify-tunnel.mjs --e2e "$RUNNER_TEMP/bridge-install/bin/tethrx-bridge"; then exit 0; fi
            echo "attempt $attempt failed"; sleep 20
          done
          exit 1

  ios:
    name: ios (build)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version
      - name: diff engine
        run: |
          # The app has no test target; DiffModel.swift imports Foundation only so
          # its alignment can be checked on its own, which is where the bugs would be.
          swiftc -O -o "$RUNNER_TEMP/difftest" ios/tools/difftest.swift ios/GrokRemote/DiffModel.swift
          "$RUNNER_TEMP/difftest"
      - name: rendezvous + pairing links agree with the bridge
        run: |
          node bridge/test/rendezvous-fixture.mjs "$RUNNER_TEMP/rendezvous.json"
          swiftc -O -o "$RUNNER_TEMP/rendezvoustest" ios/tools/rendezvoustest.swift ios/GrokRemote/Rendezvous.swift
          "$RUNNER_TEMP/rendezvoustest" "$RUNNER_TEMP/rendezvous.json"
      - name: push route from the provisioning profile
        run: |
          swiftc -O -o "$RUNNER_TEMP/pushroutetest" ios/tools/pushroutetest.swift ios/GrokRemote/PushRoute.swift
          "$RUNNER_TEMP/pushroutetest"
      - name: build
        run: |
          set -o pipefail
          # The GrokRemote scheme embeds the watchOS app, so this needs the watchOS
          # platform installed on the runner as well as iOS.
          xcodebuild -project ios/GrokRemote.xcodeproj -scheme GrokRemote \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
      - name: watch app is embedded
        run: |
          # A dropped embed phase is invisible until an archive fails to export, so
          # check the bundle actually carries both the extensions and the watch app.
          APP=$(find ~/Library/Developer/Xcode/DerivedData -name GrokRemote.app -path '*-iphonesimulator/*' | head -1)
          test -n "$APP" || { echo "no built app found"; exit 1; }
          test -d "$APP/Watch/TethrXWatch.app" || { echo "watch app not embedded"; exit 1; }
          test -d "$APP/Watch/TethrXWatch.app/PlugIns/TethrXWatchWidget.appex" \
            || { echo "watch complication not embedded"; exit 1; }
          test -d "$APP/PlugIns/TethrXWidget.appex" || { echo "widget not embedded"; exit 1; }
          test -d "$APP/PlugIns/TethrXShare.appex" || { echo "share extension not embedded"; exit 1; }
          echo "watch app, its complication, the widget and the share extension are all embedded"

  bridge-release:
    name: publish tested bridge package
    needs: [bridge, tunnel, ios]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: tethrx-bridge-release
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: tethrx-bridge-package
          path: bridge-dist
      - name: Publish GitHub bridge package
        working-directory: bridge-dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="$(jq -r .version bridge-version.json)"
          printf 'Bridge version: %s\nSource commit: %s\n\nInstall or update:\n\n```sh\nnpm i -g --prefer-online https://github.com/zwthys-cyber/TethrX/releases/download/bridge-latest/tethrx-bridge.tgz\n```\n\nRestart the bridge after updating. Pairing and session data are retained.\n' "$VERSION" "$GITHUB_SHA" > bridge-notes.md
          if gh release view bridge-latest >/dev/null 2>&1; then
            gh release upload bridge-latest tethrx-bridge.tgz tethrx-bridge.tgz.sha256 bridge-version.json --clobber
            gh release edit bridge-latest --title "TethrX Bridge $VERSION" --notes-file bridge-notes.md --prerelease
          else
            gh release create bridge-latest tethrx-bridge.tgz tethrx-bridge.tgz.sha256 bridge-version.json \
              --target "$GITHUB_SHA" --title "TethrX Bridge $VERSION" --notes-file bridge-notes.md --prerelease --latest=false
          fi
      - name: Install through the published download URL
        working-directory: bridge-dist
        run: |
          set -euo pipefail
          PREFIX="$RUNNER_TEMP/published-bridge"
          npm i -g --prefer-online --ignore-scripts --no-audit --no-fund --prefix "$PREFIX" \
            https://github.com/zwthys-cyber/TethrX/releases/download/bridge-latest/tethrx-bridge.tgz
          node -e 'const fs=require("fs");const expected=JSON.parse(fs.readFileSync("bridge-version.json"));const actual=require(process.argv[1]);if(actual.name!=="tethrx-bridge"||actual.version!==expected.version)throw Error("Published install URL does not deliver the expected bridge")' "$PREFIX/lib/node_modules/tethrx-bridge/package.json"
