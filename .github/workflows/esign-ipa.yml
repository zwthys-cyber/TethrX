name: ESign IPA

# Unsigned IPA for iPhone 17 Pro Max on iOS 26.6.
# Sign it on the phone with 全能签 and a certificate whose provisioning
# profile contains that device. TrollStore cannot install on iOS 26.
on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: Bundle ID allowed by your signing profile
        required: true
        default: nsk-164.v-team.cn
        type: string
  push:
    branches: [main]
    paths:
      - .github/workflows/esign-ipa.yml
      - ios/**
      - docs/iphone17pm-ios26.6.md

permissions:
  contents: write

jobs:
  ipa:
    name: unsigned iOS 26.6 IPA for 全能签
    runs-on: macos-26
    timeout-minutes: 45
    env:
      ESIGN_BUNDLE_ID: ${{ inputs.bundle_id || 'nsk-164.v-team.cn' }}
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version

      # A single personal certificate covers one bundle id. The watch app,
      # widget, and share extension each need their own id, so this package
      # keeps only the iPhone app. Pairing stays in the app's own keychain.
      - name: Check ESign configuration
        run: python3 -m unittest discover -s ios/tools -p 'test_*.py' -v

      - name: Prepare standalone iPhone app
        run: |
          python3 ios/tools/prepare-esign.py --bundle-id "$ESIGN_BUNDLE_ID"
          plutil -lint ios/GrokRemote.xcodeproj/project.pbxproj ios/GrokRemote/Info.plist

      - name: Build GrokRemote for iPhone
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/GrokRemote.xcodeproj \
            -scheme GrokRemote \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            CODE_SIGN_STYLE=Manual \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/GrokRemote.app"
          test -d "$APP"
          echo "App: $APP"
          # Check the build before cleanup, so an accidental embedded target is
          # caught instead of silently discarded after its code has been built.
          test ! -d "$APP/PlugIns"
          test ! -d "$APP/Watch"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" = "$ESIGN_BUNDLE_ID"
          test "$(/usr/libexec/PlistBuddy -c 'Print :TethrXStandalone' "$APP/Info.plist")" = "true"
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSSupportsLiveActivities' "$APP/Info.plist")" = "false"
          lipo "$APP/GrokRemote" -verify_arch arm64
          # 全能签 replaces the signature. Leave no ldid or ad-hoc signature,
          # and no extension bundles a one-app certificate cannot cover.
          rm -rf "$APP/PlugIns" "$APP/Watch" "$APP/_CodeSignature"
          find "$APP" -type d -name '_CodeSignature' -print0 | xargs -0 rm -rf
          MIN="$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist")"
          echo "MinimumOSVersion=$MIN"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP" Payload/TethrX.app
          /usr/libexec/PlistBuddy -c 'Set :CFBundleDisplayName TethrX' Payload/TethrX.app/Info.plist
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' Payload/TethrX.app/Info.plist)" = "GrokRemote"
          test -x Payload/TethrX.app/GrokRemote
          zip -r -y TethrX-iPhone17ProMax-iOS26.6-esign.ipa Payload
          ls -lh TethrX-iPhone17ProMax-iOS26.6-esign.ipa
          file Payload/TethrX.app/GrokRemote
          shasum -a 256 TethrX-iPhone17ProMax-iOS26.6-esign.ipa > TethrX-iPhone17ProMax-iOS26.6-esign.ipa.sha256

      - uses: actions/upload-artifact@v6
        with:
          name: TethrX-iPhone17ProMax-iOS26.6-esign
          path: |
            TethrX-iPhone17ProMax-iOS26.6-esign.ipa
            TethrX-iPhone17ProMax-iOS26.6-esign.ipa.sha256
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="iphone17pm-ios26.6"
          cp docs/iphone17pm-ios26.6.md /tmp/esign-notes.md
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Payload/TethrX.app/Info.plist)"
          TITLE="TethrX $VERSION for iPhone 17 Pro Max / iOS 26.6 (全能签)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" TethrX-iPhone17ProMax-iOS26.6-esign.ipa TethrX-iPhone17ProMax-iOS26.6-esign.ipa.sha256 --clobber
            gh release edit "$TAG" --notes-file /tmp/esign-notes.md --title "$TITLE" --prerelease
          else
            gh release create "$TAG" TethrX-iPhone17ProMax-iOS26.6-esign.ipa TethrX-iPhone17ProMax-iOS26.6-esign.ipa.sha256 \
              --title "$TITLE" \
              --notes-file /tmp/esign-notes.md \
              --prerelease \
              --latest=false
          fi
