name: tunnel-probe

on:
  push:
    branches: [cursor/no-tailscale-tunnel-954f]
    paths: [.github/tunnel-probe/**, .github/workflows/tunnel-probe.yml]

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: |
          curl -fsSL -o "$RUNNER_TEMP/cloudflared" https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x "$RUNNER_TEMP/cloudflared"
          CLOUDFLARED="$RUNNER_TEMP/cloudflared" node .github/tunnel-probe/probe.mjs
